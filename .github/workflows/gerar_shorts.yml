name: Gerar Shorts Automáticos

on:
  schedule:
    # Executa a cada 30 minutos
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar FFmpeg e utilitários de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fontconfig

      - name: Instalar Dependências do Python
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Preparar Estrutura de Pastas e Recurso de Imagem/Logo
        run: |
          # 1. Cria a estrutura de pastas esperada pelo script
          mkdir -p gerador assets/fontes assets/img assets/audio saida
          
          # 2. Copia os scripts python para a pasta gerador/
          cp -r *.py gerador/ 2>/dev/null || true
          
          # 3. Mapeia as fontes para todas as pastas possíveis
          cp *.ttf assets/fontes/ 2>/dev/null || true
          cp *.ttf gerador/ 2>/dev/null || true
          cp *.ttf assets/ 2>/dev/null || true
          
          # Instala fontes no sistema do GitHub Runner
          sudo mkdir -p /usr/share/fonts/truetype/custom
          sudo cp *.ttf /usr/share/fonts/truetype/custom/ 2>/dev/null || true
          sudo fc-cache -f -v

          # 4. Copia imagens do repositório para assets/img/
          cp *.png assets/img/ 2>/dev/null || true
          cp -r img/* assets/img/ 2>/dev/null || true

          # 5. Garante a existência do arquivo logo-branco.png (cria uma imagem transparente se não existir)
          python -c "
          import os
          from PIL import Image
          path = 'assets/img/logo-branco.png'
          if not os.path.exists(path):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              img = Image.new('RGBA', (200, 50), (255, 255, 255, 0))
              img.save(path)
              print('Logo temporária/fallback gerada em:', path)
          "

      - name: Executar Gerador de Shorts
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PLAYLIST_SHORTS: ${{ secrets.YT_PLAYLIST_SHORTS }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        run: |
          if [ -f "gerador/gerar_video.py" ]; then
            python gerador/gerar_video.py --feed --envio
          else
            python gerar_video.py --feed --envio
          fi
