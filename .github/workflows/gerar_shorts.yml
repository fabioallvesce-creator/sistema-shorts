name: Gerar vídeos para YouTube

on:
  schedule:
    - cron: '0 */6 * * *' # Executa a cada 6 horas
  workflow_dispatch:
    inputs:
      lote:
        description: 'Quantidade de posts a processar'
        required: true
        default: '1'
      todos:
        description: 'Processar todos? (sim/nao)'
        required: true
        default: 'nao'

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Gerador e Enviar para o YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PLAYLIST_SHORTS: ${{ secrets.YT_PLAYLIST_SHORTS }}
        run: |
          python gerar_video.py --feed --lote ${{ github.event.inputs.lote || 1 }} --envio
