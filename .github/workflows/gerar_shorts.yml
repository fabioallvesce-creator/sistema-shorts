name: Gerar Shorts Automáticos

on:
  schedule:
    - cron: '*/30 * * * *'  # Executa a cada 30 minutos
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar FFmpeg e utilitários de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fontconfig

      - name: Instalar Dependências do Python
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Preparar Estrutura de Pastas e Recursos (Fontes, Logos e Áudios)
        run: |
          # 1. Cria a estrutura completa de pastas esperada pelo script
          mkdir -p gerador assets/fontes assets/img assets/audio saida
          
          # 2. Copia scripts Python para gerador/
          cp -r *.py gerador/ 2>/dev/null || true
          
          # 3. Copia fontes TTF para todas as pastas possíveis
          cp *.ttf assets/fontes/ 2>/dev/null || true
          cp *.ttf gerador/ 2>/dev/null || true
          cp *.ttf assets/ 2>/dev/null || true
          
          # Instala fontes no sistema do Runner
          sudo mkdir -p /usr/share/fonts/truetype/custom
          sudo cp *.ttf /usr/share/fonts/truetype/custom/ 2>/dev/null || true
          sudo fc-cache -f -v

          # 4. Copia imagens para assets/img/
          cp *.png assets/img/ 2>/dev/null || true
          cp -r img/* assets/img/ 2>/dev/null || true

          # Garante que a logo exista
          python -c "
          import os
          from PIL import Image
          path = 'assets/img/logo-branco.png'
          if not os.path.exists(path):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              img = Image.new('RGBA', (200, 50), (255, 255, 255, 0))
              img.save(path)
          "

          # 5. Mapeia os áudios (bed-saude.mp3, bed-noticias.mp3, etc.) para assets/audio/
          cp *.mp3 assets/audio/ 2>/dev/null || true
          cp -r audio/* assets/audio/ 2>/dev/null || true

          # Cria áudio de fallback em caso de falta de arquivo de trilha
          python -c "
          import os, subprocess
          for bed in ['bed-saude.mp3', 'bed-noticias.mp3']:
              p = f'assets/audio/{bed}'
              if not os.path.exists(p):
                  os.makedirs('assets/audio', exist_ok=True)
                  subprocess.run(['ffmpeg', '-y', '-f', 'lavfi', '-i', 'anullsrc=r=44100:cl=stereo', '-t', '5', p], check=False)
          "

      - name: Executar Gerador de Shorts
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PLAYLIST_SHORTS: ${{ secrets.YT_PLAYLIST_SHORTS }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        run: |
          if [ -f "gerador/gerar_video.py" ]; then
            python gerador/gerar_video.py --feed --envio
          else
            python gerar_video.py --feed --envio
          fi
