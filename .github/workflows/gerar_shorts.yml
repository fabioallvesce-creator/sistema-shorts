name: Gerar Shorts Automáticos

on:
  schedule:
    - cron: '0 */3 * * *'  # Executa a cada 3 horas
  workflow_dispatch:        # Permite executar manualmente

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar FFmpeg e utilitários
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fontconfig

      - name: Instalar Dependências do Python
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Preparar Estrutura de Fontes e Arquivos
        run: |
          # 1. Copia config para o nível acima
          cp config.json ../config.json || true
          
          # 2. Copia fontes para o nível acima
          cp *.ttf ../ 2>/dev/null || true
          
          # 3. Cria pastas comuns que o script costuma procurar
          mkdir -p assets gerador/assets
          cp *.ttf assets/ 2>/dev/null || true
          cp *.ttf gerador/assets/ 2>/dev/null || true
          
          # 4. Instala as fontes diretamente no sistema operacional do Linux
          sudo mkdir -p /usr/share/fonts/truetype/custom
          sudo cp *.ttf /usr/share/fonts/truetype/custom/
          sudo fc-cache -f -v

      - name: Executar Gerador de Shorts
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        run: |
          python gerar_video.py --feed --envio
