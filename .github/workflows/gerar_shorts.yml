name: Gerar vídeos para YouTube

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      lote:
        description: 'Quantidade de posts a processar'
        required: true
        default: '1'
      todos:
        description: 'Processar todos? (sim/nao)'
        required: true
        default: 'nao'

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar Dependências do Sistema (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Instalar Dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install feedparser google-api-python-client google-auth-httplib2 google-auth-oauthlib requests Pillow

      - name: Executar Gerador e Enviar para o YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python gerar_video.py --feed --lote ${{ github.event.inputs.lote || 1 }} --envio ${{ github.event.inputs.todos == 'sim' && '--todos' || '' }}
